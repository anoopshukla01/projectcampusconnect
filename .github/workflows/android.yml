name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK (v1.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: campus-connect-react/package-lock.json

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Node Dependencies
        run: |
          cd campus-connect-react
          npm ci

      - name: Build React App (Production)
        run: |
          cd campus-connect-react
          npm run build

      - name: Capacitor Sync
        run: |
          cd campus-connect-react
          npx cap sync

      - name: Build Android Debug APK
        run: |
          cd campus-connect-react/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-connect-v1.3-debug
          path: campus-connect-react/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        run: |
          echo "## 🎓 Campus Connect Android Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | 1.3 (versionCode 13) |" >> $GITHUB_STEP_SUMMARY
          echo "| App ID | com.college.campusconnect |" >> $GITHUB_STEP_SUMMARY
          echo "| Min SDK | 24 (Android 7.0+) |" >> $GITHUB_STEP_SUMMARY
          echo "| Target SDK | 36 |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ What's in v1.3" >> $GITHUB_STEP_SUMMARY
          echo "- 🎨 **New app icon** — Graduation cap + network dots, indigo/violet/pink gradient" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 **Skills Section** — Student self-profile technical/soft skills management" >> $GITHUB_STEP_SUMMARY
          echo "- 🐛 **Bug Fix** — /resume/suggestions crash fixed" >> $GITHUB_STEP_SUMMARY
          echo "- 🐛 **Bug Fix** — StudentProfile auto-provisioned on first login" >> $GITHUB_STEP_SUMMARY
          echo "- 🗂️ **Navigation** — My Profile in Sidebar Settings section" >> $GITHUB_STEP_SUMMARY
